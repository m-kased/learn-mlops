# Fill mnist-input.json with random pixels, then POST to KServe Triton predictor.
apiVersion: batch/v1
kind: Job
metadata:
  name: kserve-mnist-test
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 120
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: test
          image: python:3.12-slim
          command: ["python", "-c"]
          args:
            - |
              import json, random, urllib.request
              url = "http://mnist-triton-predictor.default.svc.cluster.local/v2/models/mnist/infer"
              pixels = [random.random() for _ in range(1 * 1 * 28 * 28)]
              payload = {
                "inputs": [{
                  "name": "INPUT__0",
                  "shape": [1, 1, 28, 28],
                  "datatype": "FP32",
                  "data": pixels,
                }]
              }
              req = urllib.request.Request(
                url,
                data=json.dumps(payload).encode(),
                headers={"Content-Type": "application/json"},
              )
              with urllib.request.urlopen(req, timeout=60) as resp:
                  body = json.loads(resp.read())
              scores = body["outputs"][0]["data"]
              pred = max(range(len(scores)), key=lambda i: scores[i])
              print(f"predicted={pred} scores_len={len(scores)}", flush=True)
              print(json.dumps(body)[:500], flush=True)
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
