# Cost safety: list GKE clusters in the project and delete any that exist.
# Runs in GitHub — works when your laptop is asleep.
#
# Setup: make schedule-help
# Manual run: GitHub → Actions → "Destroy GKE cluster" → Run workflow

name: Destroy GKE cluster

on:
  schedule:
    # Daily 20:00 UTC (23:00 in UTC+3). Edit to taste.
    - cron: "0 20 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  destroy:
    runs-on: ubuntu-latest
    env:
      PROJECT: gke-ml-500613
    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT }}

      - name: List and delete GKE clusters
        run: |
          set -euo pipefail
          echo "Listing clusters in project ${PROJECT}..."
          clusters_json=$(gcloud container clusters list \
            --project="${PROJECT}" \
            --format=json)
          echo "${clusters_json}" | jq .

          count=$(echo "${clusters_json}" | jq 'length')
          if [ "${count}" -eq 0 ]; then
            echo "No clusters found — nothing to do."
            exit 0
          fi

          echo "${clusters_json}" | jq -r '.[] | "\(.name)\t\(.location)"' | \
          while IFS=$'\t' read -r name location; do
            echo "Deleting cluster ${name} (${location})..."
            gcloud container clusters delete "${name}" \
              --project="${PROJECT}" \
              --location="${location}" \
              --quiet
            echo "Deleted ${name}."
          done

          echo "Done. Remaining clusters:"
          gcloud container clusters list --project="${PROJECT}" || true
