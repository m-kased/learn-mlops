apiVersion: batch/v1
kind: Job
metadata:
  name: triton-load
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: load
          image: python:3.12-slim
          command: ["python", "/app/load_infer.py"]
          env:
            - name: TRITON_URL
              value: http://triton:8000
            - name: TRITON_MODEL
              value: "LOAD_MODEL_PLACEHOLDER"
            - name: LOAD_REQUESTS
              value: "128"
            - name: LOAD_WORKERS
              value: "32"
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          volumeMounts:
            - name: code
              mountPath: /app
      volumes:
        - name: code
          configMap:
            name: triton-load-code
