apiVersion: v1
kind: Pod
metadata:
  name: gpu-test
spec:
  restartPolicy: Never
  # Tolerate the taint GKE puts on GPU nodes so the pod can schedule.
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
  containers:
    - name: cuda
      image: nvidia/cuda:12.4.1-base-ubuntu22.04
      command: ["/bin/bash", "-c"]
      args:
        - "nvidia-smi && echo '--- GPU is working! ---'"
      resources:
        limits:
          nvidia.com/gpu: 1   # request 1 GPU; this is what schedules onto the GPU node
