apiVersion: v1
kind: Pod
metadata:
  name: pytorch-test
spec:
  restartPolicy: Never
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
  containers:
    - name: pytorch
      image: pytorch/pytorch:2.5.1-cuda12.4-cudnn9-runtime
      command: ["python", "-c"]
      args:
        - |
          import torch
          print("torch version :", torch.__version__)
          print("cuda available:", torch.cuda.is_available())
          assert torch.cuda.is_available(), "CUDA not available to PyTorch!"
          print("device name   :", torch.cuda.get_device_name(0))
          # Real computation on the GPU, not just a capability check.
          a = torch.randn(4096, 4096, device="cuda")
          b = torch.randn(4096, 4096, device="cuda")
          c = a @ b
          torch.cuda.synchronize()
          print("matmul result device:", c.device, "shape:", tuple(c.shape))
          print("--- PyTorch can use the GPU! ---")
      resources:
        limits:
          nvidia.com/gpu: 1
