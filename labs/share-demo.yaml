apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpu-share
  labels:
    app: gpu-share
spec:
  replicas: 3   # 3 pods each request 1 GPU; with time-sharing x4 they all land on ONE physical T4
  selector:
    matchLabels:
      app: gpu-share
  template:
    metadata:
      labels:
        app: gpu-share
    spec:
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: worker
          image: pytorch/pytorch:2.5.1-cuda12.4-cudnn9-runtime
          command: ["python", "-c"]
          args:
            - |
              import os, time, torch
              name = os.environ.get("HOSTNAME")
              print(f"{name}: cuda={torch.cuda.is_available()} dev={torch.cuda.get_device_name(0)}", flush=True)
              # Keep a little work on the GPU so it shows up in nvidia-smi.
              x = torch.randn(2048, 2048, device="cuda")
              while True:
                  y = x @ x
                  torch.cuda.synchronize()
                  time.sleep(2)
          resources:
            limits:
              nvidia.com/gpu: 1
