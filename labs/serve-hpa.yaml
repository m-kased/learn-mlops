# Scales mnist-serve replicas based on CPU usage.
# Needs metrics-server (enabled by default on GKE) and CPU requests on the Deployment.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mnist-serve
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mnist-serve
  minReplicas: 1
  maxReplicas: 3   # fits on one time-shared T4 (max 4 GPU slots)
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
